<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-label="SQL 강의·실습 기록 표지. BEYOND THE QUERY. J209 조건의 집계에서 명세서 2554건과 고유 수진자 894명은 서로 다른 단위임을 강조한 편집형 타이포그래피 표지. WHERE 조건, COUNT 집계 단위, JOIN 검산의 핵심 학습을 함께 제시.">
<defs>
 <pattern id="paper" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#C4C1B7" opacity=".29"/></pattern>
 <pattern id="ruled" width="17" height="17" patternUnits="userSpaceOnUse"><path d="M0 16.5H17" stroke="#D5D7CC" opacity=".35" stroke-width=".5"/></pattern>
</defs>
<rect width="1500" height="650" fill="#F7F3E9"/>
<rect width="1500" height="650" fill="url(#paper)"/>
<!-- Editorial masthead -->
<path d="M67 59H1433" stroke="#192F34" stroke-width="2.7"/>
<circle cx="83" cy="40" r="8.5" fill="#C74C34"/>
<text x="102" y="46" font-size="14" font-family="'DejaVu Sans',Arial,sans-serif" font-weight="bold" letter-spacing="2" fill="#233A3A">SQL / LEARNING NOTES</text>
<text x="1425" y="46" text-anchor="end" font-family="'NanumGothic','Noto Sans CJK KR',sans-serif" font-size="15" fill="#233A3A">강의 · 실습 · 과제 기록</text>
<text x="750" y="191" text-anchor="middle" font-family="'DejaVu Serif',Georgia,serif" font-size="91" font-weight="bold" letter-spacing="-6.5" fill="#152B30">BEYOND THE QUERY</text>
<!-- Big reveal: no symmetrical cards, no dashboard content -->
<path d="M535 215Q754 230 965 213" fill="none" stroke="#B64133" stroke-width="5" stroke-linecap="round"/>
<text x="750" y="276" text-anchor="middle" font-size="33" font-weight="bold" font-family="'NanumMyeongjo','Noto Serif CJK KR',serif" fill="#1B3436">숫자를 구하는 것보다, 그 숫자가 뜻하는 것을 이해하기.</text>
<text x="750" y="310" text-anchor="middle" font-size="17" font-family="'NanumGothic','Noto Sans CJK KR',sans-serif" fill="#65706C">J209 실습에서 배운 집계 단위의 차이</text>
<path d="M67 339H1433" stroke="#1B3436" stroke-width="1.5"/>

<!-- The single meaningful comparison -->
<text x="89" y="384" font-size="18" font-family="'DejaVu Sans Mono',monospace" letter-spacing=".2" fill="#556464">COUNT(*)</text>
<text x="936" y="384" font-size="18" font-family="'DejaVu Sans Mono',monospace" letter-spacing=".2" fill="#556464">COUNT(DISTINCT jid)</text>
<text x="80" y="494" font-family="'DejaVu Sans',Arial,sans-serif" font-size="110" font-weight="bold" letter-spacing="-7" fill="#162F34">2,554</text>
<text x="488" y="478" font-size="35" font-family="'NanumGothic','Noto Sans CJK KR',sans-serif" font-weight="bold" fill="#162F34">건</text>
<!-- Circle drawn as editor's proof mark -->
<ellipse cx="755" cy="457" rx="59" ry="55" fill="none" stroke="#BD4536" stroke-width="3.5" transform="rotate(-14 755 457)"/>
<text x="755" y="476" text-anchor="middle" font-size="67" font-family="'DejaVu Sans',sans-serif" fill="#BD4536" font-weight="bold">≠</text>
<text x="933" y="494" font-family="'DejaVu Sans',Arial,sans-serif" font-size="110" font-weight="bold" letter-spacing="-7" fill="#167278">894</text>
<text x="1210" y="479" font-size="35" font-family="'NanumGothic','Noto Sans CJK KR',sans-serif" font-weight="bold" fill="#167278">명</text>
<path d="M83 515H554M932 515H1417" stroke="#BBC0B5" stroke-width="1"/>
<text x="90" y="546" font-family="'NanumGothic','Noto Sans CJK KR',sans-serif" font-size="19" fill="#47595A">청구 명세서: 조건에 맞는 기록 수</text>
<text x="940" y="546" font-family="'NanumGothic','Noto Sans CJK KR',sans-serif" font-size="19" fill="#47595A">고유 수진자: 중복을 제외한 사람 수</text>
<!-- handwritten correction demonstrates thought, not decoration -->
<text x="750" y="542" text-anchor="middle" font-family="'NanumGothic','Noto Sans CJK KR',sans-serif" font-size="16" fill="#B64033" font-weight="bold">한 건 ≠ 한 명</text>
<path d="M694 553Q749 561 811 552" fill="none" stroke="#B64033" stroke-width="2"/>

<!-- Numbered learning prompts, text-first, no boxes -->
<path d="M67 580H1433" stroke="#1B3436" stroke-width="1.6"/>
<text x="78" y="616" font-family="'DejaVu Sans Mono',monospace" font-size="14" fill="#B64133">WHERE</text>
<text x="155" y="616" font-family="'NanumGothic','Noto Sans CJK KR',sans-serif" font-size="17" fill="#273B3C">조건이 맞는가?</text>
<path d="M484 595v24" stroke="#B7BDB5" stroke-width="1.5"/>
<text x="516" y="616" font-family="'DejaVu Sans Mono',monospace" font-size="14" fill="#B64133">GROUP BY</text>
<text x="638" y="616" font-family="'NanumGothic','Noto Sans CJK KR',sans-serif" font-size="17" fill="#273B3C">집계 기준이 맞는가?</text>
<path d="M958 595v24" stroke="#B7BDB5" stroke-width="1.5"/>
<text x="991" y="616" font-family="'DejaVu Sans Mono',monospace" font-size="14" fill="#B64133">JOIN</text>
<text x="1057" y="616" font-family="'NanumGothic','Noto Sans CJK KR',sans-serif" font-size="17" fill="#273B3C">분석 대상이 그대로인가?</text>
</svg>